[project]
name = "ibkr-trade-agent"
version = "0.1.0"
description = "CAN SLIM-driven IBKR portfolio review agent that stages trades for one-click approval."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",  # Agent runtime with native MCP support
    "pyyaml>=6.0",              # config.yaml
    "python-dotenv>=1.0",       # .env loading
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Self-hosted transport: talk to a local IB Gateway / TWS instead of the MCP connector.
# Needed only for unattended runs -- see docs/RUNNING.md and docs/HOSTING.md Path B.
gateway = [
    "ib_async>=1.0",
]

[project.scripts]
daily-review = "workflows.daily_review:main"
account-summary = "broker.account:main"
gateway-check = "broker.gateway:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "broker", "analysis", "risk", "journal", "signals", "reporting", "workflows"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
