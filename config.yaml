# ibkr-trade-agent configuration
# All risk limits live here. Read agent/settings.py for how these are loaded and validated.

account:
  # "paper" or "live". Flipping to "live" ALSO requires IBKR_ALLOW_LIVE=1 in the
  # environment (two independent switches, by design). See risk/guardrails.py.
  mode: paper
  # Account base currency. Your connected IBKR account reports SGD; keep this in sync so the
  # risk caps below are interpreted in the account's own currency.
  base_currency: SGD
  # Identity check — confirm the connected IBKR account is really YOURS before any trading.
  # These are NON-SENSITIVE markers only. NEVER put account numbers, passwords, or tokens
  # here (the connector never exposes them, and credentials must never enter the repo).
  # Run `python -m broker.session` to see your account's fingerprint, then set the markers
  # you recognize. When set, the agent refuses to operate if the live account doesn't match.
  verify:
    expected_base_currency: "SGD"  # your account's base currency (locks in identity)
    label: ""                      # optional nickname you recognize, e.g. "my-ibkr-margin"

# Self-hosted transport (optional). Set transport: gateway to talk to a locally-running
# IB Gateway / TWS via ib_async instead of the Claude MCP connector. This is the path for
# UNATTENDED runs: the MCP connector does not respond in a headless scheduled session
# (see docs/RUNNING.md "Known limitation"), whereas the Gateway does.
#   pip install -e ".[gateway]"      # installs ib_async
#   python -m broker.gateway --check # verify connectivity
# Orders are ALWAYS staged with transmit=False — they appear in TWS awaiting your click and
# can never be sent to the exchange by this code.
gateway:
  # "mcp" (default; interactive Claude sessions) or "gateway" (self-hosted IB Gateway/TWS).
  transport: mcp
  host: 127.0.0.1
  # Gateway paper 4002 | Gateway live 4001 | TWS paper 7497 | TWS live 7496.
  # A paper config refuses to connect to a live port, and vice versa.
  port: 4002
  client_id: 17
  # Optional; only needed if your login manages several accounts.
  account: ""
  # true blocks order placement at the API level. Set false only when you want the review to
  # stage orders into TWS for approval.
  readonly: true
  timeout: 20

strategy:
  # "blend" = CAN SLIM fundamentals to pick, technicals to time (your chosen style).
  style: blend
  # Asset classes the agent is allowed to propose trades in.
  asset_classes:
    - stock
    - etf
    - option
  # Default number of new ideas the recommend skill returns each review.
  # Keep this SMALL. Every candidate is CAN SLIM graded (many data calls each), so a large
  # number makes a scheduled run so long it can be cut off before it delivers anything. 5 is
  # a full morning's worth of actionable ideas; raise it only if runs are finishing early.
  new_ideas_count: 5

risk:
  # Hard caps enforced BEFORE an order is ever staged. An order breaching any of these
  # is rejected by risk/guardrails.py, not sent to IBKR. Monetary caps are in the account
  # base currency (account.base_currency, currently SGD).
  max_order_notional: 5000          # largest single staged order (SGD)
  max_position_weight_pct: 15       # no one position may exceed this % of equity
  max_sector_weight_pct: 35         # no one sector may exceed this % of equity
  max_new_positions_per_review: 3   # cap on fresh entries proposed per review run
  cash_buffer_pct: 5                # keep at least this % of equity in cash
  # CAN SLIM defensive rule. Stops are attached to every proposed entry.
  stop_loss_pct: 8                  # 7-8% loss-cutting stop (tighten to 3 in a correction)
  correction_stop_loss_pct: 3
  take_profit_pct: 22               # take many 20-25% gains; hold the strongest leaders

# Position-management thresholds the review uses when grading existing holdings.
management:
  # Grade drops to AVOID -> propose exit. WATCH with these breaches -> propose trim.
  trim_on_gain_pct: 22              # ring the register on strength
  hard_exit_on_loss_pct: 8          # honor the stop
  option_dte_warn: 10               # flag options within N days of expiry

universe:
  # Default screening universe for new ideas.
  listing: US                       # US-listed common stock (method assumes NYSE/Nasdaq)
  # Optional: restrict to a theme (e.g. "AI", "energy"); empty = broad market.
  theme: ""
  # Symbols to always include when grading (e.g. your core holdings). Populated at runtime
  # from live positions; this list is an additional manual watchlist.
  watchlist: []

schedule:
  # How often the review runs. One of: daily (default) | weekly | biweekly | monthly.
  # `python -m agent.schedule` prints the exact UTC cron to put in your Routine for this
  # cadence, accounting for daylight saving. See docs/RUNNING.md §5C.
  frequency: daily
  # Local wall-clock time to run, "HH:MM" (pre-market recommended), in the timezone below.
  run_time: "08:30"
  timezone: America/New_York
  # For weekly/biweekly: which weekday (mon..sun). Ignored for daily/monthly.
  day_of_week: mon
  # For monthly: day-of-month, 1-28 (kept <=28 so it exists in every month). Ignored otherwise.
  day_of_month: 1
  # Optional explicit UTC cron override. If set (non-empty), it wins over the derived schedule
  # above — use it only if you need a cadence the frequency options can't express.
  cron: ""

skills:
  # Where scripts/setup_skills.sh clones the analysis skills. The agent loads SKILL.md
  # from each of these on startup.
  recommend_path: skills/can-slim-recommend
  grader_path: skills/can-slim-grader

journal:
  db_path: journal/trade_journal.db
